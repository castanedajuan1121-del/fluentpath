<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070b1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FluentPath">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>FluentPath · Acceso</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#070b1a;color:#eef1ff;min-height:100vh;display:grid;place-items:center;padding:20px}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(800px 500px at 85% -10%,rgba(139,92,246,.35),transparent 60%),radial-gradient(700px 500px at -10% 40%,rgba(34,211,238,.18),transparent 60%),radial-gradient(600px 400px at 60% 110%,rgba(244,114,182,.18),transparent 60%)}
.box{width:100%;max-width:410px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:34px 30px;backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45);animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.logo{width:58px;height:58px;border-radius:17px;background:linear-gradient(135deg,#8b5cf6,#22d3ee 55%,#34d399);display:grid;place-items:center;font-weight:800;font-size:26px;color:#0a0f24;margin:0 auto 14px;box-shadow:0 10px 36px rgba(139,92,246,.5)}
h1{text-align:center;font-size:25px;letter-spacing:-.6px}
h1 span{background:linear-gradient(135deg,#8b5cf6,#22d3ee 55%,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
p.s{text-align:center;color:#9aa3c7;font-size:14px;margin:6px 0 24px}
label{display:block;font-size:12px;font-weight:700;color:#9aa3c7;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 6px}
.f{position:relative}
input[type=text],input[type=password]{width:100%;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.1);color:#eef1ff;border-radius:13px;padding:13px 15px;font:inherit;font-size:15px;outline:none;transition:.15s}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.22)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#9aa3c7;font-size:17px;cursor:pointer;padding:6px}
.rem{display:flex;align-items:center;gap:9px;margin:16px 0 4px;font-size:14px;color:#c7cdee;cursor:pointer;user-select:none;text-transform:none;letter-spacing:0;font-weight:600}
.rem input{width:17px;height:17px;accent-color:#8b5cf6}
button.go{width:100%;margin-top:20px;padding:14px;border:0;border-radius:13px;background:linear-gradient(135deg,#8b5cf6,#22d3ee 55%,#34d399);color:#081028;font:inherit;font-weight:800;font-size:15.5px;cursor:pointer;box-shadow:0 8px 28px rgba(139,92,246,.4);transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px}
button.go:hover{transform:translateY(-1px)}button.go:disabled{opacity:.7;cursor:wait;transform:none}
.spin{width:17px;height:17px;border:2.5px solid rgba(8,16,40,.25);border-top-color:#081028;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{min-height:20px;margin-top:14px;text-align:center;font-size:13.5px;color:#fda4af}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.foot{text-align:center;color:#6b7398;font-size:12px;margin-top:18px}
#boot{position:fixed;inset:0;display:none;place-items:center;background:#070b1a;color:#9aa3c7;font-size:14px}
</style>
</head>
<body>
<div id="boot">Abriendo tu academia…</div>
<form class="box" id="f" autocomplete="on">
  <div class="logo">F</div>
  <h1>Fluent<span>Path</span></h1>
  <p class="s">Tu academia de inglés americano con IA · Acceso privado</p>
  <label for="u">Usuario</label>
  <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Clave</label>
  <div class="f"><input type="password" id="p" name="password" autocomplete="current-password" required><button type="button" class="eye" id="eye" aria-label="Mostrar clave">👁</button></div>
  <label class="rem"><input type="checkbox" id="r" checked> Recordarme en este dispositivo</label>
  <button class="go" id="b" type="submit">Entrar</button>
  <div class="msg" id="m"></div>
  <div class="foot">🔒 Contenido cifrado con AES-256 · solo se abre con tu usuario y clave</div>
</form>
<script>
(function(){
  var P = __PAYLOAD__;
  var enc = new TextEncoder(), dec = new TextDecoder();
  var b64 = function(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
  var tob64 = function(buf){ var u=new Uint8Array(buf), s=""; for(var i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); };
  var store = { get:function(){ try{ return localStorage.getItem("fp_sess")||sessionStorage.getItem("fp_sess"); }catch(e){ return null; } },
                set:function(v,rem){ try{ (rem?localStorage:sessionStorage).setItem("fp_sess",v); }catch(e){} },
                del:function(){ try{ localStorage.removeItem("fp_sess"); sessionStorage.removeItem("fp_sess"); }catch(e){} } };
  async function derive(user,pass){
    var salt = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode("fluentpath-v1:"+user.trim().toLowerCase()))).slice(0,16);
    var base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:P.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
  }
  async function open(key){
    var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
    return dec.decode(pt);
  }
  function launch(html,raw){
    window.FP_PROTECTED = true; window.FP_KEY = raw;
    document.open(); document.write(html); document.close();
  }
  // Sesión recordada
  (async function(){
    var s = store.get(); if(!s) return;
    document.getElementById("boot").style.display="grid";
    try{ var k = await crypto.subtle.importKey("raw", b64(s), {name:"AES-GCM"}, true, ["decrypt"]); launch(await open(k), s); }
    catch(e){ store.del(); document.getElementById("boot").style.display="none"; }
  })();
  var f=document.getElementById("f"), b=document.getElementById("b"), m=document.getElementById("m"), fails=0;
  document.getElementById("eye").onclick=function(){ var p=document.getElementById("p"); p.type=p.type==="password"?"text":"password"; };
  f.addEventListener("submit", async function(ev){
    ev.preventDefault(); if(b.disabled) return;
    var u=document.getElementById("u").value, p=document.getElementById("p").value, rem=document.getElementById("r").checked;
    b.disabled=true; b.innerHTML='<span class="spin"></span>Verificando…'; m.textContent="";
    try{
      if(fails>=3) await new Promise(function(r){ setTimeout(r, Math.min(15000, 1500*Math.pow(2,fails-3))); });
      var k = await derive(u,p), html = await open(k);
      var raw = tob64(await crypto.subtle.exportKey("raw", k));
      store.set(raw, rem);
      launch(html, raw);
    }catch(e){
      fails++; b.disabled=false; b.textContent="Entrar";
      m.textContent = (window.crypto && crypto.subtle) ? "Usuario o clave incorrectos." : "Tu navegador no soporta el cifrado necesario. Abre la página con https.";
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
    }
  });
})();
</script>
</body>
</html>
