<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FluentPath · Tu academia de inglés americano con IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1a;--bg2:#0d1430;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09);--txt:#eef1ff;--mut:#9aa3c7;--dim:#6b7398;
  --vi:#8b5cf6;--cy:#22d3ee;--pk:#f472b6;--gr:#34d399;--ye:#fbbf24;--re:#fb7185;--or:#fb923c;
  --grad:linear-gradient(135deg,#8b5cf6 0%,#22d3ee 55%,#34d399 100%);
  --grad2:linear-gradient(135deg,#f472b6 0%,#8b5cf6 100%);
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.55;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:
 radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.28),transparent 60%),
 radial-gradient(700px 500px at -10% 30%,rgba(34,211,238,.16),transparent 60%),
 radial-gradient(600px 400px at 60% 110%,rgba(244,114,182,.15),transparent 60%);z-index:-1}
a{color:var(--cy)}
button{font-family:inherit}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:250px;flex-shrink:0;background:rgba(7,11,26,.75);backdrop-filter:blur(14px);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:18px;color:#0a0f24;box-shadow:0 8px 30px rgba(139,92,246,.45)}
.brand b{font-size:18px;letter-spacing:-.3px}.brand small{display:block;color:var(--mut);font-size:11px;font-weight:500}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--mut);cursor:pointer;font-weight:600;font-size:14px;transition:.18s;border:1px solid transparent}
.nav:hover{background:var(--card);color:var(--txt)}
.nav.on{background:linear-gradient(135deg,rgba(139,92,246,.22),rgba(34,211,238,.12));color:#fff;border-color:rgba(139,92,246,.35)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.navsec{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);padding:14px 12px 4px;font-weight:700}
.side .foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--re)}
.dot.ok{background:var(--gr);box-shadow:0 0 10px var(--gr)}
/* Main */
main{flex:1;padding:28px 34px 60px;max-width:1280px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:30px;font-weight:800;letter-spacing:-.8px;line-height:1.15}
h1 .g,.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:12px}
h3{font-size:15.5px;font-weight:700;margin-bottom:8px}
.sub{color:var(--mut);margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(8px);position:relative;min-width:0}
.card.glow{background:linear-gradient(160deg,rgba(139,92,246,.16),rgba(34,211,238,.06) 60%,rgba(255,255,255,.03));border-color:rgba(139,92,246,.3)}
.stat .v{font-size:30px;font-weight:800;letter-spacing:-1px}
.stat .l{color:var(--mut);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-weight:700;font-size:14px;cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.13);transform:translateY(-1px)}
.btn.p{background:var(--grad);color:#081028;border:none;box-shadow:0 6px 24px rgba(139,92,246,.35)}
.btn.pk{background:var(--grad2);color:#fff;border:none}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:10px}
.btn.rec{background:#e11d48;border:none;color:#fff;animation:pulse 1.3s infinite}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.6)}50%{box-shadow:0 0 0 12px rgba(225,29,72,0)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
input,textarea,select{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:11px 14px;font-family:inherit;font-size:14.5px;outline:none;transition:.15s}
input:focus,textarea:focus,select:focus{border-color:var(--vi);box-shadow:0 0 0 3px rgba(139,92,246,.2)}
select option{background:#111833}
textarea{resize:vertical;min-height:90px}
label.lb{display:block;font-size:12.5px;color:var(--mut);font-weight:700;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;font-weight:600;cursor:pointer;transition:.15s;user-select:none}
.chip.on{background:rgba(139,92,246,.25);border-color:var(--vi);color:#fff}
.tag{display:inline-block;padding:3px 9px;border-radius:8px;font-size:11.5px;font-weight:700;background:rgba(34,211,238,.14);color:var(--cy)}
.tag.vi{background:rgba(139,92,246,.18);color:#c4b5fd}.tag.pk{background:rgba(244,114,182,.15);color:var(--pk)}
.tag.gr{background:rgba(52,211,153,.15);color:var(--gr)}.tag.ye{background:rgba(251,191,36,.15);color:var(--ye)}.tag.re{background:rgba(251,113,133,.15);color:var(--re)}
.bar{height:9px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--grad);transition:width .6s}
.mut{color:var(--mut)}.small{font-size:12.5px}.mono{font-family:'JetBrains Mono',monospace}
.task{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:13px;background:rgba(0,0,0,.2);border:1px solid var(--line);margin-bottom:8px;transition:.15s}
.task.done{opacity:.6}.task.done .tt{text-decoration:line-through}
.task .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--vi);display:grid;place-items:center;cursor:pointer;flex-shrink:0;font-size:13px}
.task.done .ck{background:var(--gr);border-color:var(--gr);color:#062}
.task .tt{flex:1;font-weight:600;font-size:14px}
.ai-out{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:14px;line-height:1.65}
.ai-out h4{font-size:15px;margin:10px 0 6px;color:#c4b5fd}
.ai-out ul{padding-left:20px;margin:6px 0}
.ai-out strong{color:#fff}
.loading{display:flex;align-items:center;gap:10px;color:var(--mut);padding:14px 0}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.15);border-top-color:var(--cy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.35);color:#fecdd3;padding:12px 14px;border-radius:12px;margin-top:12px;font-size:13.5px}
.score{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:26px;font-weight:800;flex-shrink:0}
.bubble{max-width:80%;padding:12px 16px;border-radius:18px;margin-bottom:10px;line-height:1.5}
.bubble.u{background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(139,92,246,.2));margin-left:auto;border-bottom-right-radius:6px}
.bubble.a{background:var(--card2);border-bottom-left-radius:6px}
.fix{font-size:13px;margin-top:8px;padding:9px 12px;border-radius:11px;background:rgba(251,191,36,.09);border-left:3px solid var(--ye);color:#fde68a}
.chat{height:440px;overflow-y:auto;padding:6px 4px 10px;display:flex;flex-direction:column}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;padding:4px}
.cal .d{aspect-ratio:1/0.85;border-radius:11px;background:rgba(0,0,0,.22);border:1px solid var(--line);padding:6px 8px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.cal .d:hover{border-color:var(--vi)}
.cal .d.today{border:2px solid var(--cy)}
.cal .d.full{background:rgba(52,211,153,.25)}.cal .d.part{background:rgba(251,191,36,.16)}.cal .d.miss{background:rgba(251,113,133,.14)}
.cal .d.sun::after{content:"📝";font-size:11px;align-self:flex-end}
.cal .d.empty{visibility:hidden}
.phase{border-left:3px solid var(--line);padding:4px 0 18px 18px;position:relative}
.phase::before{content:"";position:absolute;left:-8px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--bg);border:3px solid var(--dim)}
.phase.now{border-color:var(--vi)}.phase.now::before{border-color:var(--cy);background:var(--cy);box-shadow:0 0 14px var(--cy)}
.phase.past::before{border-color:var(--gr);background:var(--gr)}
.flash{min-height:200px;display:grid;place-items:center;text-align:center;cursor:pointer;font-size:28px;font-weight:800;border-radius:20px;background:linear-gradient(140deg,rgba(139,92,246,.25),rgba(34,211,238,.12));border:1px solid rgba(139,92,246,.35);padding:24px;transition:.25s}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid var(--line);color:var(--txt);font-size:14.5px;cursor:pointer;margin-bottom:8px;font-weight:500;transition:.15s}
.opt:hover{border-color:var(--vi)}.opt.ok{background:rgba(52,211,153,.2);border-color:var(--gr)}.opt.no{background:rgba(251,113,133,.18);border-color:var(--re)}
.word{display:inline-block;padding:2px 6px;border-radius:6px;margin:2px}
.w-ok{background:rgba(52,211,153,.15);color:#a7f3d0}.w-bad{background:rgba(251,113,133,.2);color:#fecdd3;text-decoration:underline wavy}.w-miss{background:rgba(251,191,36,.15);color:#fde68a}
.fbbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:14px 0}
.fbsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.fbsec h4{margin:0 0 10px!important;font-size:15px;color:#c4b5fd}
.ecard{padding:12px 14px;border-radius:13px;background:rgba(0,0,0,.22);border:1px solid var(--line);margin-bottom:8px}
.ediff{margin:6px 0;font-size:15px}
.fbok{padding:12px;border-radius:12px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.3);color:#a7f3d0}
.btn.ghost{padding:3px 8px;background:transparent}
.wchip{cursor:pointer;font-size:16px;padding:5px 9px;transition:.15s}.wchip:hover{transform:translateY(-2px)}
.w-close{background:rgba(251,191,36,.15);color:#fde68a}.w-extra{background:rgba(148,163,184,.15);color:#cbd5e1;text-decoration:line-through}
.scard{padding:14px;border-radius:14px;background:linear-gradient(160deg,rgba(139,92,246,.12),rgba(0,0,0,.2));border:1px solid rgba(139,92,246,.25)}
.big-ipa{font-family:'JetBrains Mono',monospace;color:var(--cy);font-size:15px}
.delta{font-weight:800;font-size:13px;padding:3px 9px;border-radius:8px}
.caret{display:inline-block;width:8px;height:16px;background:var(--cy);margin-left:3px;vertical-align:-2px;animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dot.busy{background:var(--ye);animation:pulse 1s infinite}
main>*{animation:fin .32s cubic-bezier(.2,.8,.2,1) both}
main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
@keyframes fin{from{opacity:0;transform:translateY(10px)}}
.card{transition:transform .18s,border-color .18s,box-shadow .18s}
.grid>.card:hover{border-color:rgba(139,92,246,.35);box-shadow:0 10px 40px rgba(139,92,246,.12)}
.bubble{animation:fin .25s both}
.opt:active,.btn:active{transform:scale(.97)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:120}
.toast{position:fixed;bottom:24px;right:24px;background:#151d3f;border:1px solid var(--vi);padding:14px 20px;border-radius:14px;font-weight:600;z-index:99;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:tin .3s}
@keyframes tin{from{transform:translateY(20px);opacity:0}}
.ring{position:relative;width:130px;height:130px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800}
.hero-lvl{font-size:56px;font-weight:800;letter-spacing:-2px;line-height:1}
.res{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid var(--line);text-decoration:none;color:var(--txt);transition:.15s}
.res:hover{border-color:var(--cy);transform:translateY(-2px)}
.res .e{font-size:26px}
.yt{aspect-ratio:16/9;width:100%;border:0;border-radius:14px;background:#000}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.hide{display:none!important}
.mobtop{display:none}
@media(max-width:980px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){
 .side{position:fixed;left:-270px;z-index:50;transition:.25s;width:260px}.side.open{left:0}
 .mobtop{display:flex;position:sticky;top:0;z-index:40;padding:12px 16px;background:rgba(7,11,26,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);align-items:center;gap:12px}
 main{padding:18px 16px 60px}.g2,.g3,.g4{grid-template-columns:1fr}h1{font-size:24px}.bubble{max-width:92%}
}
</style>
</head>
<body>
<div class="mobtop"><button class="btn sm" onclick="document.querySelector('.side').classList.toggle('open')">☰</button><b class="g">FluentPath</b></div>
<div class="app">
<aside class="side" id="side"></aside>
<main id="main"></main>
</div>

<script>
/* =========================================================
   FluentPath — Academia autónoma de inglés americano con IA
   Toda tu información se guarda en este navegador (localStorage).
   ========================================================= */

const DEFAULT_KEY = /^%%/.test("%%GEMINI_KEY%%") ? "" : "%%GEMINI_KEY%%"; // la inyecta el build desde un secreto de GitHub
const BASE = "https://generativelanguage.googleapis.com/v1beta";
const STORE = "fluentpath_v1";
const LEVELS = ["A1","A2","B1","B2","C1","C2"];
const SKILLS = {pron:"Pronunciación",listen:"Escucha",speak:"Conversación",write:"Escritura",gram:"Gramática",vocab:"Vocabulario"};

/* ---------------- STATE ---------------- */
const defState = () => ({
  name:"", apiKey:DEFAULT_KEY, model:"gemini-2.5-flash", level:"A1", placementDone:false,
  skills:{pron:20,listen:20,speak:20,write:20,gram:20,vocab:20},
  xp:0, days:{}, vocab:[], mistakes:[], evals:[], weekly:{}, startDate:todayKey(),
  prefs:{interests:["Películas","Series"], style:"Mixto", minutes:45, rate:0.95},
  models:[], modelMode:"auto", active:null, available:[], fresh:true, updatedAt:0
});
let S;
function load(){
  try{ S = Object.assign(defState(), JSON.parse(localStorage.getItem(STORE)||"{}")); }catch(e){ S = defState(); }
  if(!S.vocab.length) S.vocab = VOCAB_SEED.map(v=>({...v,box:0,due:todayKey()}));
  if(DEFAULT_KEY && (!S.apiKey || S.keySrc!=="user") && S.apiKey!==DEFAULT_KEY){ S.apiKey=DEFAULT_KEY; S.keySrc="default"; S.active=null; }
  S._st = S.active?"ok":"idle";
}
function saveLocal(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); }catch(e){} }
function save(){ S.updatedAt=Date.now(); saveLocal(); if(typeof scheduleSync==="function") scheduleSync(); }

/* ---------------- HELPERS ---------------- */
function todayKey(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(k,n){ const d=parseKey(k); d.setDate(d.getDate()+n); return todayKey(d); }
function weekKey(k=todayKey()){ const d=parseKey(k); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); return todayKey(d); }
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const attr = s => esc(s).replace(/\n/g," ");
function md(t){
  let s = esc(t||"");
  s = s.replace(/^### (.*)$/gm,"<h4>$1</h4>").replace(/^## (.*)$/gm,"<h4>$1</h4>").replace(/^# (.*)$/gm,"<h4>$1</h4>");
  s = s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>").replace(/`([^`]+)`/g,"<code class='mono'>$1</code>");
  s = s.replace(/(?:^|\n)((?:[-•*] .*(?:\n|$))+)/g,(m,b)=>"\n<ul>"+b.trim().split("\n").map(l=>"<li>"+l.replace(/^[-•*] /,"")+"</li>").join("")+"</ul>");
  s = s.replace(/(?:^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,b)=>"\n<ol style='padding-left:20px'>"+b.trim().split("\n").map(l=>"<li>"+l.replace(/^\d+\. /,"")+"</li>").join("")+"</ol>");
  return s.replace(/\n{2,}/g,"<br><br>").replace(/\n/g,"<br>");
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.innerHTML=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
const loader = (txt="La IA está pensando…") => `<div class="loading"><div class="spin"></div>${txt}</div>`;
const errBox = e => `<div class="err">⚠️ ${esc(e.message||e)}<br><span class="small">Revisa tu API key y el modelo en <a href="#" onclick="go('settings');return false">Ajustes</a>.</span></div>`;
const scoreColor = n => n>=85?"var(--gr)":n>=65?"var(--cy)":n>=45?"var(--ye)":"var(--re)";
const scoreCircle = n => `<div class="score" style="border:4px solid ${scoreColor(n)};color:${scoreColor(n)}">${Math.round(n)}</div>`;
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function addXP(n){ S.xp+=n; save(); renderSide(); }
function bumpSkill(k,score){ if(!(k in S.skills)) return; S.skills[k]=Math.round(S.skills[k]*0.8+Math.max(0,Math.min(100,score))*0.2); save(); }
function logMistakes(area,list){ (list||[]).slice(0,8).forEach(m=>{ if(m&&(m.wrong||m.error)) S.mistakes.unshift({date:todayKey(),area,wrong:m.wrong||m.error||"",right:m.right||m.correct||m.correction||"",note:m.note||m.explanation||m.tip||""}); }); S.mistakes=S.mistakes.slice(0,300); save(); }

/* ---------------- VOICE: TTS + STT ---------------- */
let voices=[];
function loadVoices(){ voices = speechSynthesis.getVoices().filter(v=>/en[-_]US/i.test(v.lang)); }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function speak(text,rate){
  if(!("speechSynthesis" in window)) return toast("Tu navegador no soporta voz.");
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang="en-US"; u.rate=rate||S.prefs.rate||0.95;
  const pref = voices.find(v=>/Google US|Samantha|Aria|Jenny|Guy|Natural/i.test(v.name)) || voices[0];
  if(pref) u.voice=pref; speechSynthesis.speak(u);
}
function listenSTT(onText,onEnd){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast("Dictado no disponible: usa Chrome o Edge."); onEnd&&onEnd(); return null; }
  const r=new SR(); r.lang="en-US"; r.interimResults=true; r.continuous=false;
  r.onresult=e=>{ let t=""; for(const x of e.results) t+=x[0].transcript; onText(t, e.results[e.results.length-1].isFinal); };
  r.onend=()=>onEnd&&onEnd(); r.onerror=()=>onEnd&&onEnd(); r.start(); return r;
}

/* ---------------- AUDIO RECORDING → WAV ---------------- */

  ["level","skills","prefs","name","placementDone"].forEach(k=>{ if(newer[k]!==undefined) out[k]=newer[k]; });
  out.placementDone=!!(L.placementDone||R.placementDone);
  out.xp=Math.max(L.xp||0,R.xp||0);
  out.startDate=[L.startDate,R.startDate].filter(Boolean).sort()[0];
  out.days={...(R.days||{})};
  for(const [k,d] of Object.entries(L.days||{})){ const r=out.days[k]; out.days[k]=!r?d:{...d,tasks:d.tasks.map((t,i)=>({...t,done:t.done||!!r.tasks?.[i]?.done}))}; }
  out.evals=uniq([...arr(R.evals),...arr(L.evals)],e=>e.date+e.type+e.score).sort((a,b)=>a.date<b.date?-1:1);
  out.mistakes=uniq([...arr(R.mistakes),...arr(L.mistakes)],m=>m.date+m.wrong).sort((a,b)=>a.date<b.date?1:-1).slice(0,300);
  out.pronHist=uniq([...arr(R.pronHist),...arr(L.pronHist)],h=>h.k+h.score+h.date).slice(-200);
  const vm=new Map(); [...arr(R.vocab),...arr(L.vocab)].forEach(v=>{ const k=(v.en||"").toLowerCase(), p=vm.get(k); if(!p||(v.t||0)>(p.t||0)) vm.set(k,v); }); out.vocab=[...vm.values()];
  out.weekly={...(R.weekly||{}),...(L.weekly||{})};
  return out;
}
function applyRemote(obj){ for(const k of Object.keys(S)) if(!DEVICE_FIELDS.includes(k)) delete S[k]; Object.assign(S,obj); }
async function syncNow(){
  if(!syncOn()) return;
  if(SYNC.busy){ SYNC.again=true; return; }
  SYNC.busy=true; setSync("busy");
  try{
    for(let i=0;i<4;i++){
      const remote=await syncPull(), base=S.syncBase||0, localChanged=(S.updatedAt||0)>base;
      let changedFromRemote=false;
      if(remote && !remote.__oldKey && S.fresh){ applyRemote(mergeStates(syncPayload(),remote,true)); S.updatedAt=Date.now(); changedFromRemote=true; saveLocal(); }
      else if(remote && !remote.__oldKey && (remote.updatedAt||0)>base){
        if(localChanged){ applyRemote(mergeStates(syncPayload(),remote)); S.updatedAt=Date.now(); }
        else { applyRemote(remote); S.updatedAt=remote.updatedAt||Date.now(); S.syncBase=S.updatedAt; changedFromRemote=true; }
        saveLocal();
      }
      if(!remote || remote.__oldKey || (S.updatedAt||0)>(S.syncBase||0)){ if(await syncPush()==="conflict") continue; }
      S.fresh=false; saveLocal();
      if(changedFromRemote) refreshAfterSync();
      break;
    }
    SYNC.last=Date.now(); SYNC.err=""; setSync("ok");
  }catch(e){ SYNC.err=e.message; setSync("err"); }
  SYNC.busy=false;
  if(SYNC.again){ SYNC.again=false; setTimeout(syncNow,300); }
}
function scheduleSync(){ if(!syncOn()) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(syncNow,4000); }
function setSync(st){ SYNC.state=st; const el=$("#syncSt"); if(el) el.outerHTML=syncBadge(); const s2=$("#syncCard"); if(s2) s2.innerHTML=syncCardInner(); }
function ago(t){ const s=Math.round((Date.now()-t)/1000); return s<10?"recién":s<60?`hace ${s} s`:s<3600?`hace ${Math.round(s/60)} min`:`hace ${Math.round(s/3600)} h`; }

  return `<div id="syncSt" class="small" style="margin-top:4px;color:${m[2]}" title="${attr(SYNC.err)}">${m[0]} ${m[1]}</div>`; }

function calNav(n){ calM+=n; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} drawCal(); }
function drawCal(){
  $("#calT").textContent=new Date(calY,calM,1).toLocaleDateString("es-CL",{month:"long",year:"numeric"});
  const first=(new Date(calY,calM,1).getDay()+6)%7, n=new Date(calY,calM+1,0).getDate(), tk=todayKey();
  let h=["Lu","Ma","Mi","Ju","Vi","Sá","Do"].map(x=>`<div class="dh">${x}</div>`).join("")+"<div class='d empty'></div>".repeat(first);
  for(let i=1;i<=n;i++){ const k=todayKey(new Date(calY,calM,i)); const p=dayPct(k); let c="";
    if(p===1)c="full"; else if(p>0)c="part"; else if(k<tk && k>=S.startDate)c="miss";
    if(new Date(calY,calM,i).getDay()===0)c+=" sun"; if(k===tk)c+=" today";
    h+=`<div class="d ${c}" onclick="showDay('${k}')"><span>${i}</span></div>`; }
  $("#cal").innerHTML=h;
}
function showDay(k){ const d=S.days[k]||{tasks:planFor(k)}; $("#dayDetail").innerHTML=`<h3>${parseKey(k).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}</h3>`+d.tasks.map(t=>taskRow(t,k)).join(""); }
function renderWeekly(w){ return `<h3 style="color:#fff">${esc(w.title)}</h3><p class="mut">${esc(w.goal)}</p>${(w.days||[]).map(x=>`<div class="task"><span class="tag vi">${esc(x.day)}</span><span class="tt">${esc(x.task)}</span></div>`).join("")}<div class="fix">🏁 Prueba final del domingo: ${esc(w.test)}</div>`; }
async function genWeekly(){
  const el=$("#weekly"); el.innerHTML=loader("Diseñando tu reto semanal…"); const ph=currentPhase();
  try{ const w=await ai(`Crea el RETO SEMANAL para la fase "${ph.t}" (metas: ${ph.goals.join("; ")}). Basado en mis debilidades y errores. JSON: {"title":"nombre motivador","goal":"objetivo medible de la semana (español)","days":[{"day":"Lunes","task":"tarea concreta de 15-20 min"}, ... hasta Domingo],"test":"cómo comprobaré el domingo que lo logré"}`,{json:true,schema:SCH.weekly,normalize:N.list("days"),validate:r=>!!r.title&&r.days.length>0});
    S.weekly[weekKey()]=w; save(); el.innerHTML=renderWeekly(w); addXP(5); }catch(e){ el.innerHTML=errBox(e); }

/* ---------- PRONUNCIATION ---------- */
let pronTarget="";
VIEWS.pron = () => {
  M(head(`Laboratorio de <span class="g">pronunciación</span>`,"Escucha el modelo americano, grábate (o sube un audio) y la IA te dice exactamente qué palabras y sonidos corregir.")+
  `<div class="grid g2">
   <div class="card">
    <h2>1 · Elige qué practicar</h2>
    <label class="lb">Sonido difícil para hispanohablantes</label>
    <select id="pSel" onchange="pickPron()">${PRON.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join("")}</select>
    <div id="pInfo" class="ai-out"></div>
    <label class="lb">Frase objetivo (puedes escribir la tuya)</label>
    <textarea id="pText" rows="2" oninput="pronTarget=this.value"></textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn" onclick="speak($('#pText').value)">🔊 Escuchar</button>
      <button class="btn" onclick="speak($('#pText').value,0.65)">🐢 Lento</button>
      <button class="btn" onclick="aiPronPhrase()">✨ Frase nueva con IA</button>
    </div>
   </div>
   <div class="card glow">
    <h2>2 · Grábate o sube tu audio</h2>
    <p class="mut small">Consejo: técnica <b>shadowing</b> — escucha, imita el ritmo y la entonación, luego grábate.</p>
    <div class="row" style="margin:14px 0">
      <button class="btn p" id="recBtn" onclick="toggleRec()">🎙️ Grabar</button>
      <label class="btn">📁 Subir audio<input type="file" accept="audio/*" class="hide" onchange="pronFile(this.files[0])"></label>
      <button class="btn" onclick="pronFree()">🗣️ Modo libre (sin frase)</button>
    </div>
    <audio id="pAudio" controls class="hide" style="width:100%"></audio>
   </div>
  </div><div id="pOut" style="margin-top:16px"></div>`);
  pickPron();
};
function pickPron(){ const p=PRON.find(x=>x.id===$("#pSel").value); $("#pInfo").innerHTML=`<b>Cómo se hace:</b> ${esc(p.tip)}<br><span class="small mono" style="color:var(--cy)">${esc(p.pairs)}</span><div class="row" style="margin-top:8px">${p.s.map(s=>`<span class="chip" onclick="$('#pText').value='${attr(s).replace(/'/g,"\\'")}';pronTarget=$('#pText').value">${esc(s)}</span>`).join("")}</div>`; $("#pText").value=p.s[0]; pronTarget=p.s[0]; }
async function aiPronPhrase(){ const p=PRON.find(x=>x.id===$("#pSel").value); try{ $("#pText").value="Generando…"; const r=await ai(`Genera UNA frase natural en inglés americano (nivel ${S.level}) para practicar el sonido "${p.n}", con varias palabras que lo contengan, sobre ${S.prefs.interests.join(" o ")}. Responde SOLO la frase.`,{temp:1}); $("#pText").value=r.trim().replace(/^"|"$/g,""); pronTarget=$("#pText").value; }catch(e){ $("#pText").value=pronTarget; toast(esc(e.message)); } }
let pronFreeMode=false;
async function toggleRec(){
  const b=$("#recBtn");
  if(!mediaRec){ try{ await startRecording(); b.className="btn rec"; b.innerHTML="⏹ Detener y evaluar"; }catch(e){ toast("No pude acceder al micrófono: "+esc(e.message)); } }
  else{ b.className="btn p"; b.innerHTML="🎙️ Grabar"; const blob=await stopRecording(); evalPron(blob); }
}
function pronFile(f){ if(f) evalPron(f); }
function pronFree(){ pronFreeMode=true; toast("Modo libre: habla de lo que quieras y la IA evaluará tu pronunciación."); toggleRec(); }
const PRON_SCHEMA = SX.o({
  transcript:SX.s, score:SX.n, accuracy:SX.n, fluency:SX.n, intonation:SX.n, rhythm:SX.n, completeness:SX.n, cefr:SX.s, summary:SX.s,
  words:SX.a(SX.o({word:SX.s,status:SX.e(["ok","close","wrong","missing","extra"]),heard:SX.s,ipa:SX.s,respelling:SX.s,tip:SX.s})),
  sounds:SX.a(SX.o({sound:SX.s,in_words:SX.s,problem:SX.s,how_to:SX.s,spanish_vs_english:SX.s,minimal_pairs:SX.a(SX.s),drill:SX.s})),
  prosody:SX.o({stress:SX.s,intonation:SX.s,rhythm:SX.s,linking:SX.s}),
  native_model:SX.s, respelling:SX.s, strengths:SX.a(SX.s),
  priorities:SX.a(SX.o({title:SX.s,why:SX.s,exercise:SX.s})), next_phrases:SX.a(SX.s)
});
function normPron(r){ r=unwrap(r); ["score","accuracy","fluency","intonation","rhythm","completeness"].forEach(k=>r[k]=num(r[k]));
  r.words=arr(r.words); r.sounds=arr(r.sounds); r.priorities=arr(r.priorities); r.next_phrases=arr(r.next_phrases); r.strengths=arr(r.strengths); r.prosody=r.prosody||{};
  if(r.score==null){ const v=["accuracy","fluency","intonation","rhythm"].map(k=>r[k]).filter(x=>x!=null); if(v.length) r.score=v.reduce((a,b)=>a+b)/v.length; }
  return r; }
let lastPron=null;
async function evalPron(blob){
  const a=$("#pAudio"); a.src=URL.createObjectURL(blob); a.classList.remove("hide");
  const out=$("#pOut"); out.innerHTML=loader("Escuchando tu audio y analizando cada sonido, palabra y entonación…");
  const target=pronFreeMode?"":$("#pText").value.trim(); pronFreeMode=false;
  try{
    const part=await audioPart(blob);
    const prompt=`Eres un coach de acento americano (General American) especializado en hispanohablantes. Escucha MUY atentamente el audio y entrega una retroalimentación COMPLETA, honesta y accionable.
${target?`Frase objetivo que el estudiante intentó decir: "${target}". Compara palabra por palabra (incluye TODAS las palabras de la frase objetivo en "words", en orden).`:"El estudiante habló libremente: evalúa cada palabra importante que dijo."}
Instrucciones:
- transcript: lo que realmente se escucha (en inglés). Si no se oye voz, transcript "" y score 0.
- Puntajes 0-100 realistas (no regales puntos): accuracy (sonidos), fluency (pausas, velocidad), intonation (melodía), rhythm (acentos y reducción de sílabas débiles), completeness (palabras dichas vs objetivo). score = global.
- cefr: nivel de pronunciación estimado (A1-C2).
- summary: 2-3 frases en español con el diagnóstico principal.
- words: status ok/close/wrong/missing/extra; heard = cómo sonó; ipa = IPA americano correcto; respelling = cómo se pronuncia escrito para hispanohablante (ej. "θɪŋk" → "zink con lengua entre dientes"); tip = corrección concreta en español.
- sounds: 2-4 sonidos problemáticos detectados (ej. /θ/, /ɪ/, /r/, schwa, -ed, flap t). how_to = posición exacta de lengua, labios y aire; spanish_vs_english = por qué un hispanohablante falla; minimal_pairs = 3-4 pares; drill = ejercicio de 1 minuto.
- prosody: comentario en español de stress, intonation, rhythm y linking en MI audio.
- native_model: la frase como la diría un nativo, con las sílabas acentuadas en MAYÚSCULAS y ‿ donde se enlazan palabras.
- respelling: la frase completa escrita como suena para un hispanohablante.
- strengths: 2-3 cosas concretas que hice bien.
- priorities: las 3 prioridades ordenadas, cada una con por qué y un ejercicio.
- next_phrases: 3 frases nuevas para practicar mis problemas.`;
    const r=await ai([{role:"user",parts:[part,{text:prompt}]}],{json:true,temp:0.2,deep:true,schema:PRON_SCHEMA,normalize:normPron,validate:r=>r.score!=null&&(r.transcript!=null)});
    if(!r.transcript || !r.transcript.trim()){ out.innerHTML=`<div class="err">🔇 No logré escuchar tu voz en el audio. Revisa que el micrófono correcto esté activo, habla más cerca y vuelve a grabar.</div>`; return; }
    S.pronHist=S.pronHist||[]; const key=(target||"libre").toLowerCase(); const prev=[...S.pronHist].reverse().find(h=>h.k===key);
    S.pronHist.push({k:key,score:Math.round(r.score),date:todayKey()}); S.pronHist=S.pronHist.slice(-200);
    bumpSkill("pron",r.score); if(r.fluency!=null) bumpSkill("speak",r.fluency);
    logMistakes("Pronunciación",r.words.filter(w=>w.status!=="ok").map(w=>({wrong:`${w.word} (sonó "${w.heard||"?"}")`,right:`${w.ipa||""} ${w.respelling||""}`.trim(),note:w.tip}))); addXP(15); completeTask("pron");
    lastPron=r; renderPron(r,target,prev);
  }catch(e){ out.innerHTML=errBox(e); }
}
function renderPron(r,target,prev){
  const d=prev?Math.round(r.score-prev.score):null;
  const W=r.words, bad=W.filter(w=>w.status!=="ok");
  $("#pOut").innerHTML=`<div class="ai-out">
   <div class="row" style="gap:18px;align-items:flex-start;flex-wrap:nowrap">${scoreCircle2(r.score)}<div style="flex:1">
     <div class="row">${r.cefr?`<span class="tag vi">Pronunciación ${esc(r.cefr)}</span>`:""}${d!=null?`<span class="delta" style="background:${d>=0?"rgba(52,211,153,.15)":"rgba(251,113,133,.15)"};color:${d>=0?"var(--gr)":"var(--re)"}">${d>=0?"▲ +":"▼ "}${d} vs intento anterior</span>`:""}</div>
     <div style="margin-top:6px">${esc(r.summary)}</div>
     <div class="small mut" style="margin-top:6px">🎧 Se entendió: <b style="color:#fff">“${esc(r.transcript)}”</b>${target?`<br>🎯 Objetivo: “${esc(target)}”`:""}</div></div></div>
   ${bars([["Precisión de sonidos",r.accuracy],["Fluidez",r.fluency],["Entonación",r.intonation],["Ritmo y acento",r.rhythm],["Completitud",r.completeness]])}
   ${sec("🔤","Palabra por palabra",W.length?`<div>${W.map((w,i)=>`<span class="word wchip w-${w.status==="ok"?"ok":w.status==="close"?"close":w.status==="missing"?"miss":w.status==="extra"?"extra":"bad"}" onclick="wordDetail(${i})">${esc(w.word)}</span>`).join(" ")}</div>

};
function startChat(i){ chat={sc:i,hist:[],auto:chat.auto}; go("talk"); chatTurn("(Start the conversation. Greet me and ask the first question.)",true); }
function drawChat(){
  const b=$("#chatBox"); if(!b) return;
  b.innerHTML=chat.hist.filter(m=>!m.hidden).map((m,i)=>m.role==="user"?`<div class="bubble u">${esc(m.text)}${m.fix?`<div class="fix">✏️ ${esc(m.fix.correction)}${arr(m.fix.errors).map(e=>`<div class="small" style="margin-top:4px">❌ ${esc(e.wrong)} → ✅ <b>${esc(e.right)}</b>${e.rule?` — ${esc(e.rule)}`:""}</div>`).join("")}${m.fix.better?`<br>💎 Más natural: <b>${esc(m.fix.better)}</b> <button class="btn sm ghost" onclick="speak('${q(m.fix.better)}')">🔊</button>`:""}${m.fix.tip?`<br><span class="small">💡 ${esc(m.fix.tip)}</span>`:""}</div>`:""}</div>`
   :`<div class="bubble a">${esc(m.text)} <button class="btn sm" style="padding:3px 8px" onclick="speak(chat.hist[${chat.hist.indexOf(m)}].text)">🔊</button>${m.es?`<details class="small mut" style="margin-top:6px"><summary>Traducción</summary>${esc(m.es)}</details>`:""}${m.hint?`<details class="small" style="margin-top:4px;color:var(--cy)"><summary>💡 Respuesta modelo</summary>${esc(m.hint)}</details>`:""}</div>`).join("")+(chat.wait?`<div class="bubble a">${loader("typing…")}</div>`:"");
  b.scrollTop=b.scrollHeight;
}
async function chatTurn(text,hidden=false){
  chat.hist.push({role:"user",text,hidden}); chat.wait=true; drawChat();
  const sc=SCENARIOS[chat.sc];
  const contents=chat.hist.map(m=>({role:m.role==="user"?"user":"model",parts:[{text:m.role==="user"?m.text:JSON.stringify({reply:m.text})}]}));
  try{
    const r=await ai(contents,{json:true,temp:0.8,schema:SCH.chat,normalize:N.obj,validate:r=>!!r.reply,system:`ROLEPLAY: ${sc[2]} Mantén el personaje y habla en inglés americano natural, adaptado al nivel ${S.level} (frases cortas si es A1-A2). Haz siempre una pregunta para continuar.
Para CADA mensaje del estudiante devuelve JSON: {"reply":"tu respuesta en inglés (máx 3 frases)","es":"traducción al español de tu respuesta","correction":"si el último mensaje del estudiante tenía errores, explícalos en español brevemente; si estaba perfecto escribe '' ","better":"versión más natural de lo que dijo el estudiante en inglés, o ''","tip":"micro-consejo opcional en español o ''","hint":"ejemplo de cómo podría responder el estudiante a tu pregunta (en inglés)","errors":[{"wrong":"fragmento exacto con error","right":"corrección","rule":"regla gramatical o de uso explicada en español"}]}
En "correction" sé específico: qué estuvo mal, por qué y cómo se dice bien.
Si el estudiante escribe en español, enséñale cómo decirlo en inglés en "better" y sigue la conversación.`,
      onChunk:f=>{ const m=f.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)/); if(m){ const b=$("#chatBox"); const live=$("#liveBubble"); const txt=m[1].replace(/\\n/g," ").replace(/\\"/g,'"'); if(live) live.textContent=txt; else if(b){ b.lastElementChild?.remove(); b.insertAdjacentHTML("beforeend",`<div class="bubble a" id="liveBubble">${esc(txt)}</div>`);} b&&(b.scrollTop=b.scrollHeight); } }});
    chat.wait=false; const last=chat.hist[chat.hist.length-1];
    if(!last.hidden && (r.correction||r.better)) last.fix={correction:r.correction||"¡Bien dicho! ✅",better:r.better,tip:r.tip,errors:arr(r.errors).filter(e=>e&&e.wrong)};
    if(!last.hidden) logMistakes("Conversación",r.errors);
    chat.hist.push({role:"model",text:r.reply,es:r.es,hint:r.hint}); drawChat(); if(chat.auto) speak(r.reply);
    if(chat.hist.filter(m=>m.role==="user"&&!m.hidden).length===5){ completeTask("speak"); addXP(20); }
  }catch(e){ chat.wait=false; chat.hist.pop(); drawChat(); $("#chatBox").insertAdjacentHTML("beforeend",errBox(e)); }
}
function sendChat(){ const i=$("#chatIn"); const t=i.value.trim(); if(!t||chat.wait) return; i.value=""; addXP(3); chatTurn(t); }

function micChat(){ const b=$("#micBtn"); if(stt){ stt.stop(); return; } b.className="btn rec"; stt=listenSTT((t,fin)=>{ $("#chatIn").value=t; },()=>{ stt=null; b.className="btn"; if($("#chatIn")?.value.trim()) sendChat(); }); }
async function endChat(){
  const userMsgs=chat.hist.filter(m=>m.role==="user"&&!m.hidden).map(m=>m.text);
  if(userMsgs.length<2) return toast("Conversa un poco más antes de evaluar (mínimo 2 mensajes).");
  $("#chatBox").insertAdjacentHTML("beforeend",`<div id="chEval">${loader("Evaluando tu conversación…")}</div>`); $("#chatBox").scrollTop=1e9;
  try{ const r=await ai(`Evalúa en detalle mi desempeño en esta conversación (escenario: ${SCENARIOS[chat.sc][1]}). Mis mensajes: ${JSON.stringify(userMsgs)}.
Puntajes 0-100 realistas. summary en español (3 frases). errors: TODOS mis errores con regla y ejemplo correcto. better_answers: reescribe 3 de mis respuestas como lo diría un nativo americano. improve: 3 acciones con ejercicio. vocab: 5 palabras/expresiones útiles que debí usar.`,{json:true,temp:0.3,deep:true,
      schema:SX.o({score:SX.n,cefr:SX.s,fluency:SX.n,grammar:SX.n,vocabulary:SX.n,interaction:SX.n,naturalness:SX.n,summary:SX.s,good:SX.a(SX.s),errors:ERRSCH,better_answers:SX.a(SX.o({mine:SX.s,better:SX.s,why:SX.s})),improve:SX.a(SX.o({title:SX.s,exercise:SX.s})),vocab:SX.a(SX.o({en:SX.s,es:SX.s}))}),
      normalize:r=>{ r=unwrap(r); ["score","fluency","grammar","vocabulary","interaction","naturalness"].forEach(k=>r[k]=num(r[k])); return r; }, validate:r=>r.score!=null});
    bumpSkill("speak",r.score); if(r.grammar!=null) bumpSkill("gram",r.grammar); if(r.vocabulary!=null) bumpSkill("vocab",r.vocabulary); logMistakes("Conversación",r.errors); addXP(30); completeTask("speak");
    arr(r.vocab).forEach(v=>{ if(v.en && !S.vocab.find(x=>x.en.toLowerCase()===v.en.toLowerCase())) S.vocab.push({en:v.en,es:v.es,lvl:S.level,box:0,due:todayKey()}); }); save();
    $("#chEval").outerHTML=`<div class="ai-out"><div class="row" style="flex-wrap:nowrap;gap:16px">${scoreCircle2(r.score)}<div><span class="tag vi">Nivel en esta conversación: ${esc(r.cefr)}</span><div style="margin-top:6px">${esc(r.summary)}</div></div></div>
     ${bars([["Fluidez",r.fluency],["Gramática",r.grammar],["Vocabulario",r.vocabulary],["Interacción",r.interaction],["Naturalidad",r.naturalness]])}
     ${sec("✅","Lo que hiciste bien",list(r.good))}${sec("❌","Tus errores",errorCards(r.errors))}
     ${arr(r.better_answers).length?sec("🇺🇸","Cómo lo diría un nativo",arr(r.better_answers).map(b=>`<div class="ecard"><div class="small mut">Tú: “${esc(b.mine)}”</div><div style="margin-top:4px">💎 <b>${esc(b.better)}</b> <button class="btn sm ghost" onclick="speak('${q(b.better)}')">🔊</button></div><div class="small" style="margin-top:4px">${esc(b.why)}</div></div>`).join("")):""}
     ${arr(r.improve).length?sec("🎯","Plan de mejora",arr(r.improve).map((p,i)=>`<div class="ecard"><b>${i+1}. ${esc(p.title)}</b><div class="small" style="color:var(--cy)">🏋️ ${esc(p.exercise)}</div></div>`).join("")):""}
     ${sec("🧠","Añadido a tu vocabulario",arr(r.vocab).map(v=>`<span class="chip" onclick="speak('${q(v.en)}')">🔊 ${esc(v.en)} · ${esc(v.es)}</span>`).join(" "))}</div>`; $("#chatBox").scrollTop=1e9;
  }catch(e){ $("#chEval").outerHTML=errBox(e); }
}

function norm(s){ return s.toLowerCase().replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean); }
function checkDict(){
  const a=norm(dict.text), b=norm($("#dIn").value); const n=a.length,m=b.length; const L=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]===b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,html=""; while(i<n){ if(j<m&&a[i]===b[j]){html+=`<span class="word w-ok">${a[i]}</span>`;i++;j++;} else if(j<m&&L[i][j+1]>=L[i+1][j]){html+=`<span class="word w-bad">${esc(b[j])}</span>`;j++;} else {html+=`<span class="word w-miss">${a[i]}</span>`;i++;} }
  const sc=Math.round(L[0][0]/Math.max(n,1)*100); bumpSkill("listen",sc); addXP(10); completeTask("listen");
  $("#dRes").innerHTML=`<div class="ai-out"><div class="row">${scoreCircle(sc)}<div><b>Texto original:</b> ${esc(dict.text)}<br><span class="mut">${esc(dict.es)}</span></div></div><div style="margin-top:10px">${html}</div><div class="small mut">🟩 correcto · 🟨 no lo escuchaste · 🟥 escribiste algo distinto</div></div>`;
}

function renderLesson(){

function ansG(i,j){
  const x=lesson.exercises[i]; if(x.done) return; x.done=true; lesson.answered++;
  const ok=j===Number(x.answer); if(ok) lesson.ok++; else logMistakes("Gramática",[{wrong:x.q.replace("___",x.options[j]),right:x.q.replace("___",x.options[x.answer]),note:x.why}]);
  $(`#g${i}_${j}`).classList.add(ok?"ok":"no"); $(`#g${i}_${x.answer}`).classList.add("ok"); $(`#gw${i}`).innerHTML=`${ok?"✅":"❌"} ${esc(x.why)}`;
  if(lesson.answered===lesson.exercises.length){ const sc=Math.round(lesson.ok/lesson.answered*100); bumpSkill("gram",sc); addXP(20); completeTask("gram"); $("#gScore").innerHTML=`<div class="ai-out row">${scoreCircle(sc)}<div><b>${lesson.ok}/${lesson.answered} correctas.</b> ${sc>=80?"¡Excelente! Tema dominado.":"Repite esta lección mañana: la repetición fija la gramática."}</div></div>`; }

};
function chartSVG(ev){ const W=640,H=180,p=30; const x=i=>p+i*(W-2*p)/Math.max(1,ev.length-1), y=v=>H-p-(v/100)*(H-2*p);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;margin-bottom:12px"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>${[0,50,85,100].map(v=>`<line x1="${p}" x2="${W-p}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v===85?.25:.07})" ${v===85?'stroke-dasharray="5 5"':""}/><text x="2" y="${y(v)+4}" fill="#6b7398" font-size="10">${v}</text>`).join("")}
  <polyline fill="none" stroke="url(#lg)" stroke-width="3" points="${ev.map((e,i)=>x(i)+","+y(e.score)).join(" ")}"/>${ev.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.score)}" r="5" fill="#22d3ee"><title>${e.date}: ${e.score}% (${e.type})</title></circle>`).join("")}</svg>`; }
function startPlacement(){ quiz={type:"Test de nivel",qs:PLACEMENT.map(([q,o,a,l])=>{const opts=shuffle(o.map((t,i)=>({t,ok:i===a}))); return {q,options:opts.map(x=>x.t),answer:opts.findIndex(x=>x.ok),lvl:l,why:""};}),i:0,ok:0,place:true}; drawQuiz(); }
async function startAIQuiz(kind,n){
  $("#qz").innerHTML=`<div class="card" style="margin-bottom:16px">${loader("Generando tu evaluación personalizada…")}</div>`;
  try{ const r=await ai(`Crea una evaluación ${kind} de ${n} preguntas de opción múltiple para nivel ${S.level}${kind==="mensual"?" (incluye 30% de preguntas del nivel siguiente)":""}. Cubre: gramática, vocabulario, expresiones americanas, comprensión de lectura breve y situaciones comunicativas. Incluye mis errores recientes. Fase actual: ${currentPhase().t}.
JSON: {"questions":[{"q":"","options":["","","",""],"answer":0,"skill":"gram|vocab|listen|write|speak","why":"explicación breve en español"}]}. Varía la posición de la respuesta correcta.`,{json:true,temp:0.8,schema:SCH.quiz,normalize:N.qs,validate:r=>r.questions.length>=Math.min(5,n)});
    quiz={type:"Evaluación "+kind,qs:r.questions.slice(0,n),i:0,ok:0,kind}; drawQuiz();
  }catch(e){ $("#qz").innerHTML=errBox(e)+`<button class="btn" style="margin:10px 0 16px" onclick="startPlacement()">Usar banco sin IA</button>`; }
}
function drawQuiz(){
  const el=$("#qz"); if(!el) return;
  if(quiz.i>=quiz.qs.length) return finishQuiz();
  const x=quiz.qs[quiz.i];
  el.innerHTML=`<div class="card glow" style="margin-bottom:16px"><div class="row sp"><h3>${esc(quiz.type)}</h3><span class="tag">${quiz.i+1}/${quiz.qs.length}</span></div><div class="bar" style="margin:8px 0 16px"><i style="width:${quiz.i/quiz.qs.length*100}%"></i></div>
   <div style="font-size:18px;font-weight:700;margin-bottom:12px">${esc(x.q)}</div>${x.options.map((o,j)=>`<button class="opt" id="q${j}" onclick="ansQ(${j})">${esc(o)}</button>`).join("")}<div id="qw"></div><div class="small mut" style="margin-top:6px">⌨️ Teclas 1–4 para responder · Enter para seguir</div></div>`;
}
function ansQ(j){
  const x=quiz.qs[quiz.i]; if(x.done) return; x.done=true; x.pick=j; const ok=j===Number(x.answer); if(ok) quiz.ok++;
  else logMistakes(quiz.type,[{wrong:x.q+" → "+x.options[j],right:x.options[x.answer],note:x.why||""}]);
  $("#q"+j).classList.add(ok?"ok":"no"); $("#q"+x.answer).classList.add("ok");
  $("#qw").innerHTML=`<div class="small" style="margin:8px 0">${ok?"✅ ¡Correcto!":"❌ Incorrecto."} ${esc(x.why||"")}</div><button class="btn p" onclick="quiz.i++;drawQuiz()">Siguiente →</button>`;
}
function finishQuiz(){
  const sc=Math.round(quiz.ok/quiz.qs.length*100); let msg="";
  if(quiz.place){ const n=quiz.ok; const lvl=n<=5?"A1":n<=9?"A2":n<=13?"B1":n<=17?"B2":"C1"; S.level=lvl; S.placementDone=true; Object.keys(S.skills).forEach(k=>S.skills[k]=Math.max(S.skills[k],Math.round(sc*0.8))); msg=`Tu nivel estimado es <b class="g" style="font-size:22px">${lvl}</b>. Toda la app se adapta ahora a este nivel.`; }
  else{ const sk={}; quiz.qs.forEach(q=>{ if(q.skill&&SKILLS[q.skill]){ sk[q.skill]=sk[q.skill]||[0,0]; sk[q.skill][1]++; if(q.pick===Number(q.answer)) sk[q.skill][0]++; } }); Object.entries(sk).forEach(([k,[a,b]])=>bumpSkill(k,a/b*100));
    const prev=S.evals.filter(e=>/mensual/.test(e.type)).slice(-1)[0];
    if(quiz.kind==="mensual" && sc>=85 && prev && prev.score>=85 && prev.level===S.level){ const ni=Math.min(5,LEVELS.indexOf(S.level)+1); S.level=LEVELS[ni]; msg=`🚀 <b>¡SUBISTE DE NIVEL a ${S.level}!</b> Dos evaluaciones mensuales seguidas sobre 85%.`; confetti(); }
    else msg = sc>=85?"¡Excelente! Vas por encima del objetivo.":sc>=65?"Buen resultado. Revisa tus errores para consolidar.":"Hay temas por reforzar: la IA los incluirá en tu plan y en 'Mis errores'.";
    completeTask("eval"); }
  S.evals.push({date:todayKey(),type:quiz.type,score:sc,level:S.level}); addXP(40); save(); if(sc>=85) confetti();
  $("#qz").innerHTML=`<div class="card glow" style="margin-bottom:16px"><div class="row">${scoreCircle(sc)}<div><h2>${esc(quiz.type)} terminada</h2><p>${quiz.ok}/${quiz.qs.length} correctas. ${msg}</p></div></div><button class="btn" style="margin-top:12px" onclick="go('evals')">Ver historial</button></div>`;
}

/* ---------- ERRORS ---------- */
VIEWS.errors = () => {
  M(head(`Mis <span class="g">errores</span>`,"Cada error que cometes en la app se guarda aquí. Repasarlos es la forma más rápida de mejorar.",`<button class="btn p" onclick="practiceErrors()">🩹 Practicar mis errores con IA</button>`)+
  `<div id="eOut"></div><div class="card">${S.mistakes.length?S.mistakes.slice(0,60).map(m=>`<div class="fix" style="margin-bottom:8px"><span class="tag vi">${esc(m.area)}</span> <span class="small mut">${m.date}</span><br>❌ ${esc(m.wrong)} → ✅ <b>${esc(m.right)}</b>${m.note?`<br><span class="small">${esc(m.note)}</span>`:""}</div>`).join(""):`<p class="mut">Aún no hay errores registrados. ¡Empieza a practicar!</p>`}</div>`);
};
async function practiceErrors(){
  if(!S.mistakes.length) return toast("Aún no tienes errores registrados.");
  const el=$("#eOut"); el.innerHTML=`<div class="card" style="margin-bottom:16px">${loader("Creando ejercicios a partir de tus errores…")}</div>`;
  try{ const r=await ai(`Estos son mis errores recientes: ${JSON.stringify(S.mistakes.slice(0,15))}. Agrúpalos por patrón y crea 8 preguntas de opción múltiple para corregirlos. JSON: {"patterns":"resumen en español de mis 2-3 patrones de error principales","questions":[{"q":"","options":["","","",""],"answer":0,"skill":"gram","why":""}]}`,{json:true,schema:SCH.errq,normalize:N.qs,validate:r=>r.questions.length>0});
    el.innerHTML=`<div class="card" style="margin-bottom:16px"><h3>🔍 Tus patrones de error</h3><div class="ai-out">${md(r.patterns)}</div></div><div id="qz"></div>`;
    quiz={type:"Repaso de errores",qs:r.questions,i:0,ok:0,kind:"errores"}; drawQuiz(); completeTask("errors"); }catch(e){ el.innerHTML=errBox(e); }
}

/* ---------- RESOURCES ---------- */
VIEWS.resources = () => {
  M(head(`Cursos y tests <span class="g">gratuitos</span>`,"Los mejores recursos gratuitos de inglés americano para complementar la app.")+
  `<div class="card glow" style="margin-bottom:16px"><h2>🧪 La metodología de FluentPath</h2><div class="grid g3" style="margin-top:10px">
   ${[["CEFR (Cambridge)","Tu ruta sigue los niveles A1→C1 del Marco Común Europeo, el estándar que usan Cambridge, institutos binacionales y Open English."],["Enfoque comunicativo","Como Open English: hablas desde el día 1 con roleplays de situaciones reales, no solo gramática."],["Repetición espaciada","Tus palabras vuelven justo antes de olvidarlas (método de Anki/Duolingo)."],["Shadowing","Imitas audio nativo en tiempo real para mejorar ritmo, entonación y acento."],["Input comprensible (i+1)","Escuchas y lees material apenas por encima de tu nivel: películas, series y videos."],["Feedback inmediato y evaluación continua","Cada ejercicio corrige tus errores al instante; cada domingo y cada mes se mide tu avance."]].map(([t,d])=>`<div><h3>${t}</h3><p class="small mut">${d}</p></div>`).join("")}</div></div>
  <div class="grid g2">${RESOURCES.map(([e,t,d,u])=>`<a class="res" href="${u}" target="_blank"><span class="e">${e}</span><div><b>${esc(t)}</b><div class="small mut">${esc(d)}</div></div></a>`).join("")}</div>`);
};

/* ---------- SETTINGS ---------- */
const INTERESTS=["Películas","Series","Música","Tecnología","Negocios","Viajes","Deportes","Comida","Videojuegos","Ciencia","Moda","Startups","Marketing","Fitness"];
VIEWS.settings = () => {
  const ml=[...new Set([...(S.available||[]),...(S.models||[]),...MODEL_PREF])];
  M(head(`<span class="g">Ajustes</span>`,"Conexión con Gemini, tu perfil de aprendizaje y respaldo de tu progreso.")+
  `<div class="grid g2"><div class="card glow"><h2>🤖 Gemini AI</h2>
   <label class="lb">API key</label><div class="row" style="flex-wrap:nowrap"><input id="sKey" type="password" value="${attr(S.apiKey)}"><button class="btn sm" onclick="const i=$('#sKey');i.type=i.type==='password'?'text':'password'">👁</button></div>
   <p class="small mut" style="margin-top:6px">Sirven las keys de <a href="https://aistudio.google.com/apikey" target="_blank">Google AI Studio</a> (empiezan con <span class="mono">AIza</span>) y las de Vertex AI (empiezan con <span class="mono">AQ.</span>). La app detecta sola cuál es.</p>
   <label class="lb">Modelo</label><select id="sModel"><option value="auto" ${S.modelMode==="auto"?"selected":""}>⚡ Automático: el más rápido disponible (recomendado)</option>${ml.map(m=>`<option value="${attr(m)}" ${m===S.modelMode?"selected":""}>${esc(m)}${(S.available||[]).includes(m)?"  ✓ disponible":""}</option>`).join("")}</select>
   <div class="ai-out small" id="sStat">${S.active?`✅ Conectado a <b>${esc(BACKEND_NAME[S.active.backend])}</b> con <b class="mono">${esc(S.active.model)}</b><br>Modelos disponibles: ${(S.available||[]).map(m=>`<span class="tag" style="margin:2px">${esc(m)}</span>`).join("")}`:"Aún no conectado. Pulsa «Conectar y probar»."}</div>
   <div class="row" style="margin-top:12px"><button class="btn p" onclick="testAI()">⚡ Conectar y probar</button><button class="btn" onclick="saveAI();toast('✅ Guardado')">Guardar</button></div><div id="sOut"></div></div>
  <div class="card"><h2>👤 Tu perfil</h2>
   <label class="lb">Nombre</label><input id="sName" value="${attr(S.name)}" placeholder="¿Cómo te llamo?">
   <label class="lb">Nivel actual</label><select id="sLvl">${LEVELS.map(l=>`<option ${l===S.level?"selected":""}>${l}</option>`).join("")}</select>
   <label class="lb">Intereses (la IA los usa para todo el contenido)</label><div class="row" id="sInt">${INTERESTS.map(i=>`<span class="chip ${S.prefs.interests.includes(i)?"on":""}" onclick="this.classList.toggle('on')">${i}</span>`).join("")}</div>
   <label class="lb">Estilo de aprendizaje</label><select id="sStyle">${["Mixto","Visual (tablas, ejemplos)","Auditivo (escuchar y repetir)","Conversacional (hablar mucho)","Analítico (reglas y gramática)","Divertido (humor, cultura pop)"].map(s=>`<option ${s===S.prefs.style?"selected":""}>${s}</option>`).join("")}</select>
   <label class="lb">Velocidad de voz: <span id="rv">${S.prefs.rate}</span></label><input type="range" id="sRate" min="0.5" max="1.3" step="0.05" value="${S.prefs.rate}" oninput="$('#rv').textContent=this.value" style="padding:0">
   <button class="btn p" style="margin-top:14px" onclick="saveProfile()">Guardar perfil</button></div></div>
   <div class="card glow" style="margin-top:16px"><h2>☁️ Sincronización entre dispositivos</h2><div id="syncCard">${syncCardInner()}</div></div>
   <div class="card" style="margin-top:16px"><h2>💾 Respaldo</h2><p class="mut small">Tu progreso vive en este navegador. Exporta un respaldo semanal para no perderlo o para pasarlo a otro equipo.</p>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="exportData()">⬇️ Exportar progreso</button><label class="btn">⬆️ Importar<input type="file" accept=".json" class="hide" onchange="importData(this.files[0])"></label><button class="btn" style="border-color:var(--re);color:var(--re)" onclick="if(confirm('¿Borrar TODO tu progreso? No se puede deshacer.')){localStorage.removeItem(STORE);load();go('home')}">🗑️ Reiniciar</button></div></div>`);
};
function saveAI(){ const k=$("#sKey").value.trim(), mm=$("#sModel").value; if(k!==S.apiKey){ S.keySrc=k?"user":"default"; } if(k!==S.apiKey||mm!==S.modelMode){ S.active=null; S.available=[]; } S.apiKey=k; S.modelMode=mm; save(); renderSide(); }
async function testAI(){ saveAI(); S.active=null; $("#sOut").innerHTML=loader("Probando todos los modelos en paralelo…"); const t0=performance.now();
  try{ await autoPick(true); const el=$("#sOut"); await aiStreamTo(el,"Say hello to the student in one short, motivating sentence in English, then translate it to Spanish.");
    el.insertAdjacentHTML("afterbegin",`<div class="small" style="color:var(--gr);margin-top:12px">✅ Listo en ${((performance.now()-t0)/1000).toFixed(1)} s</div>`); const st=$("#sStat"); if(st) st.innerHTML=`✅ Conectado a <b>${esc(BACKEND_NAME[S.active.backend])}</b> con <b class="mono">${esc(S.active.model)}</b><br>Modelos disponibles: ${(S.available||[]).map(m=>`<span class="tag" style="margin:2px">${esc(m)}</span>`).join("")}`; confetti(); }
  catch(e){ $("#sOut").innerHTML=errBox(e); } }
function saveProfile(){ S.name=$("#sName").value.trim(); S.level=$("#sLvl").value; S.prefs.interests=[...document.querySelectorAll("#sInt .chip.on")].map(c=>c.textContent); S.prefs.style=$("#sStyle").value; S.prefs.rate=Number($("#sRate").value); save(); renderSide(); toast("✅ Perfil guardado. La IA ya se adapta a ti."); }
function exportData(){ const b=new Blob([JSON.stringify({...S,apiKey:""},null,2)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=`fluentpath-${todayKey()}.json`; a.click(); }
function importData(f){ if(!f) return; f.text().then(t=>{ const d=JSON.parse(t); const key=S.apiKey; S=Object.assign(defState(),d); S.fresh=false; S.syncBase=0; if(!S.apiKey) S.apiKey=key; save(); toast("✅ Progreso importado"); go("home"); }).catch(()=>toast("Archivo inválido")); }

/* ---------- INIT ---------- */
function fpLogout(){ try{ localStorage.removeItem("fp_sess"); sessionStorage.removeItem("fp_sess"); }catch(e){} location.reload(); }
function confetti(){
  const c=document.createElement("canvas"); c.id="confetti"; c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c); const x=c.getContext("2d");
  const cols=["#8b5cf6","#22d3ee","#34d399","#f472b6","#fbbf24"]; const P=[...Array(140)].map(()=>({x:innerWidth/2,y:innerHeight/2.5,vx:(Math.random()-.5)*16,vy:Math.random()*-14-4,s:Math.random()*7+4,c:cols[Math.random()*5|0],r:Math.random()*6}));
  let f=0; (function t(){ x.clearRect(0,0,c.width,c.height); P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.45; p.vx*=.99; p.r+=.1; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); }); if(++f<110) requestAnimationFrame(t); else c.remove(); })();
}
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if(quiz && $("#q0") && !quiz.qs[quiz.i]?.done && /^[1-4]$/.test(e.key) && $("#q"+(e.key-1))){ ansQ(+e.key-1); e.preventDefault(); return; }
  if(quiz && e.key==="Enter" && quiz.qs[quiz.i]?.done && $("#qw button")){ quiz.i++; drawQuiz(); e.preventDefault(); return; }
  if(view==="vocab" && vq[vi]){ if(e.key===" "){ vflip=!vflip; drawVocab(); e.preventDefault(); } else if(vflip && /^[1-3]$/.test(e.key)) rate(+e.key-1); }
});
load(); ensureDay(); renderSide(); go("home");
if(S.apiKey) autoPick(!S.active).catch(()=>{});
if(syncOn()){ syncNow(); document.addEventListener("visibilitychange",()=>syncNow()); setInterval(()=>{ if(document.visibilityState==="visible") syncNow(); },180000); setInterval(()=>{ const e=$("#syncSt"); if(e&&SYNC.state==="ok") e.outerHTML=syncBadge(); },30000); }
</script>
